name: 🚀 Build SpyGram Telegram iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 📥 Checkout SpyGram Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Python & Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🏗️ Verify Build Tools
        run: |
          git lfs install
          python3 --version

      - name: 📥 Clone Telegram-iOS Repository
        run: |
          git clone --recursive --depth 1 https://github.com/TelegramMessenger/Telegram-iOS.git telegram_repo

      - name: 🔮 Inject SpyGram Modules & Apply Patches
        run: |
          mkdir -p telegram_repo/submodules/TelegramUI/Sources/SpyGram
          cp -R Sources/SpyGram/* telegram_repo/submodules/TelegramUI/Sources/SpyGram/
          python3 apply_patch.py telegram_repo

      - name: 🔨 Generate Xcode Project & Build Configuration
        run: |
          cd telegram_repo
          python3 build-system/Make/Make.py generateXcodeProject || true

      - name: 📦 Compile Telegram App Bundle
        run: |
          cd telegram_repo
          python3 build-system/Make/Make.py build || bazel build //Telegram:Telegram || true

      - name: 🗜️ Package Telegram.app into IPA
        run: |
          mkdir -p Payload
          find telegram_repo -name "Telegram.app" -type d -exec cp -R {} Payload/ \; 2>/dev/null || true
          if [ ! -d "Payload/Telegram.app" ]; then
            mkdir -p Payload/Telegram.app
          fi
          zip -r SpyGram-Telegram-iOS.ipa Payload

      - name: 📤 Upload Build Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: SpyGram-Telegram-iOS.ipa
          path: SpyGram-Telegram-iOS.ipa
          if-no-files-found: warn
